services:
  northstar-agent:
    image: ${AGENT_IMAGE:-northstar-agent:local}
    build:
      context: ..
      dockerfile: agent/Dockerfile
    container_name: northstar-agent
    restart: unless-stopped
    pid: host
    read_only: true
    env_file:
      - path: .env
        required: false
    environment:
      AGENT_TOKEN: ${AGENT_TOKEN:?Set AGENT_TOKEN in agent/.env}
      # Push mode (recommended): set NORTHSTAR_URL and no inbound port is needed. Leave empty for pull mode.
      NORTHSTAR_URL: ${NORTHSTAR_URL:-}
      AGENT_HOST_ROOT: ${AGENT_HOST_ROOT:-/host}
      AGENT_PROCFS_PATH: ${AGENT_PROCFS_PATH:-/host/proc}
      AGENT_DISK_PATH: ${AGENT_DISK_PATH:-/host}
      AGENT_PROCESS_TOP_N: ${AGENT_PROCESS_TOP_N:-20}
      AGENT_PROCESS_SAMPLE_SECONDS: ${AGENT_PROCESS_SAMPLE_SECONDS:-0.15}
    volumes:
      - /:${AGENT_HOST_ROOT:-/host}:ro,rslave
      - /proc:${AGENT_PROCFS_PATH:-/host/proc}:ro
    ports:
      - "${AGENT_BIND_ADDRESS:-0.0.0.0}:${AGENT_PORT:-9100}:9100"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
