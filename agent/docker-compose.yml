services:
  sm-watch-agent:
    # The published agent image. Set AGENT_IMAGE to override (for example sm-watch-agent:local after
    # `docker build -f agent/Dockerfile -t sm-watch-agent:local .` from the repository root).
    image: ${AGENT_IMAGE:-${DOCKERHUB_USERNAME:-shambi21}/sm-watch-agent:${SMWATCH_VERSION:-latest}}
    container_name: sm-watch-agent
    restart: unless-stopped
    pid: host
    read_only: true
    env_file:
      - path: .env
        required: false
    environment:
      # Recommended: a join token from the dashboard (Servers -> Add server -> Install agent). The agent registers itself
      # and keeps its own token in the sm-watch-agent-data volume. Alternatively set a per-server AGENT_TOKEN.
      SMWATCH_JOIN: ${SMWATCH_JOIN:-}
      AGENT_TOKEN: ${AGENT_TOKEN:-}
      # Push mode (recommended): set SMWATCH_URL and no inbound port is needed. Leave empty for pull mode.
      SMWATCH_URL: ${SMWATCH_URL:-}
      AGENT_HOST_ROOT: ${AGENT_HOST_ROOT:-/host}
      AGENT_PROCFS_PATH: ${AGENT_PROCFS_PATH:-/host/proc}
      AGENT_DISK_PATH: ${AGENT_DISK_PATH:-/host}
      AGENT_PROCESS_TOP_N: ${AGENT_PROCESS_TOP_N:-20}
      AGENT_PROCESS_SAMPLE_SECONDS: ${AGENT_PROCESS_SAMPLE_SECONDS:-0.15}
    volumes:
      - sm-watch-agent-data:/var/lib/sm-watch-agent
      - /:${AGENT_HOST_ROOT:-/host}:ro,rslave
      - /proc:${AGENT_PROCFS_PATH:-/host/proc}:ro
    ports:
      - "${AGENT_BIND_ADDRESS:-0.0.0.0}:${AGENT_PORT:-9100}:9100"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  sm-watch-agent-data:
