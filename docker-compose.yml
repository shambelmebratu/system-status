# SM-Watch stack. By default it runs the images published to Docker Hub by the GitHub Action
# (.github/workflows/docker-publish.yml): no source code or build tools are needed on the server.
#
#   docker compose pull && docker compose up -d                  run the published images
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build    build from this source tree instead (development)
#
# The images come from one Docker Hub repository, shambi21/sm-watch, one tag per service and version: api-latest, api-1.2.3,
# frontend-1.2.3, host-agent-1.2.3 ... DOCKERHUB_USERNAME / DOCKERHUB_REPO in .env change where; SMWATCH_VERSION picks the version.
x-api-image: &api-image ${DOCKERHUB_USERNAME:-shambi21}/${DOCKERHUB_REPO:-sm-watch}:api-${SMWATCH_VERSION:-latest}
x-host-agent-image: &host-agent-image ${DOCKERHUB_USERNAME:-shambi21}/${DOCKERHUB_REPO:-sm-watch}:host-agent-${SMWATCH_VERSION:-latest}
# Containers get no new privileges and no Linux capabilities beyond what they need.
x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
# The API image never writes to its own filesystem: mounted read-only, an intruder cannot alter the application code.
x-readonly: &readonly
  read_only: true
  tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]

x-frontend-image: &frontend-image ${DOCKERHUB_USERNAME:-shambi21}/${DOCKERHUB_REPO:-sm-watch}:frontend-${SMWATCH_VERSION:-latest}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smwatch}
      POSTGRES_USER: ${POSTGRES_USER:-smwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-this-password}
    security_opt: ["no-new-privileges:true"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: [*hardening, *readonly]
    image: *api-image
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smwatch}:${POSTGRES_PASSWORD:-replace-this-password}@postgres:5432/${POSTGRES_DB:-smwatch}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (32+ random chars) in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD (12+ chars) in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: [*hardening, *readonly]
    image: *api-image
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smwatch}:${POSTGRES_PASSWORD:-replace-this-password}@postgres:5432/${POSTGRES_DB:-smwatch}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (32+ random chars) in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD (12+ chars) in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      CHECK_INTERVAL_SECONDS: ${CHECK_INTERVAL_SECONDS:-60}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      HOST_AGENT_TOKEN_FILE: /shared/agent.token
      DOCKERHUB_USERNAME: ${DOCKERHUB_USERNAME:-shambi21}
      DOCKERHUB_REPO: ${DOCKERHUB_REPO:-sm-watch}
      SMWATCH_VERSION: ${SMWATCH_VERSION:-latest}
      AGENT_IMAGE: ${AGENT_IMAGE:-}
    env_file:
      - path: .env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - host_agent:/shared
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    <<: [*hardening, *readonly]
    image: *api-image
    command: ["python", "-m", "app.worker"]
    cap_add:
      - NET_RAW
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smwatch}:${POSTGRES_PASSWORD:-replace-this-password}@postgres:5432/${POSTGRES_DB:-smwatch}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (32+ random chars) in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD (12+ chars) in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CHECK_INTERVAL_SECONDS: ${CHECK_INTERVAL_SECONDS:-60}
    env_file:
      - path: .env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Monitors the machine this stack runs on: metrics plus the Logs tab (container logs, journald, /var/log).
  # It appears in the dashboard as "This server (control plane)". It mounts the host read-only and the Docker
  # socket (root-equivalent access); set HOST_AGENT_LOGS=nodocker or off in .env to reduce that, or delete this service.
  host-agent:
    <<: *hardening
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    image: *host-agent-image
    command: ["python", "agent.py"]
    pid: host
    # Read access (never write) to every file on the read-only host mount, so the SSH tab can show every user's shell history
    # (files are mode 600). Remove these two lines to limit it to root's own history.
    cap_add:
      - DAC_READ_SEARCH
    environment:
      SMWATCH_URL: http://api:8000
      AGENT_TOKEN_FILE: /shared/agent.token
      AGENT_HOST_ROOT: /host
      AGENT_PROCFS_PATH: /host/proc
      AGENT_DISK_PATH: /host
      AGENT_LOGS: ${HOST_AGENT_LOGS:-on}
      AGENT_SSH: ${HOST_AGENT_SSH:-on}         # on | nohistory | off: SSH sessions, logins and shell history of this machine
      SMWATCH_BUNDLED: "1"
      AGENT_ACCESS_LOG: ${HOST_ACCESS_LOG:-}   # e.g. /var/log/nginx/access.log: response-time percentiles of real traffic
    volumes:
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - host_agent:/shared:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    <<: *hardening
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    image: *frontend-image
    environment:
      BACKEND_URL: http://api:8000
      # Whose X-Forwarded-For is believed (default: only this machine, i.e. nginx on the Docker host). See frontend-next/start.js.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:8000:3000"   # FRONTEND_BIND=127.0.0.1 when a reverse proxy (nginx) is in front
    restart: unless-stopped

volumes:
  postgres_data:
  host_agent:
