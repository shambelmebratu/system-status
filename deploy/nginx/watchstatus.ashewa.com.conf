# SM-Watch behind nginx with HTTPS (Let's Encrypt / certbot).
# Copy to /etc/nginx/conf.d/watchstatus.ashewa.com.conf (or sites-available + symlink to sites-enabled).
#
# Needs in the SM-Watch .env (then `docker compose up -d`):
#   PUBLIC_URL=https://watchstatus.ashewa.com     agent install commands use this address
#   COOKIE_SECURE=true                            session cookie only over HTTPS
#   FRONTEND_BIND=127.0.0.1                       only nginx can reach the app on :8000, not the internet
#
# First-time certificate (the 443 block below needs the files to exist):
#   1. comment out the whole "listen 443" server block, then:  nginx -t && systemctl reload nginx
#   2. mkdir -p /var/www/certbot
#      certbot certonly --webroot -w /var/www/certbot -d watchstatus.ashewa.com
#   3. un-comment the 443 block, then:  nginx -t && systemctl reload nginx
#   (certbot's timer renews automatically; add  --deploy-hook "systemctl reload nginx"  once so nginx picks up renewals)

# Install links carry a short-lived secret in the URL (/api/agent/join/<token>). Keep it out of the access log.
map $request_uri $loggable_uri {
    ~^(?<prefix>/api/agent/join/)[^/?]+(?<rest>.*)$  "${prefix}[token]${rest}";
    default                                           $request_uri;
}
log_format smwatch '$remote_addr - $remote_user [$time_local] "$request_method $loggable_uri $server_protocol" '
                   '$status $body_bytes_sent "$http_user_agent"';

upstream smwatch_app {
    server 127.0.0.1:8000;      # the "frontend" container: serves the dashboard and proxies /api/* to the API
    keepalive 32;
}

# ---- HTTP: certificate challenges + redirect everything else to HTTPS -----------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name watchstatus.ashewa.com;

    access_log /var/log/nginx/watchstatus.access.log smwatch;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS -------------------------------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                    # nginx 1.25.1+. On older nginx remove this line and use:  listen 443 ssl http2;
    server_name watchstatus.ashewa.com;
    access_log /var/log/nginx/watchstatus.access.log smwatch;

    ssl_certificate     /etc/letsencrypt/live/watchstatus.ashewa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/watchstatus.ashewa.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Browser hardening. (No Content-Security-Policy here: the Next.js dashboard uses inline scripts.)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Agents post log output (up to ~600 KB) and metrics; the default 1 MB limit is fine, 2 MB leaves headroom.
    client_max_body_size 2m;

    # Everything goes to the app. These timeouts matter: agents and the Logs page keep requests open
    # ("long-polling", up to 25 s) so a log appears instantly; nginx's defaults would work, but a generous
    # read timeout means a slow log read or a brief hiccup never cuts a request.
    location / {
        proxy_pass http://smwatch_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # OVERWRITE (not append) so a client can never forge its own address: the app uses it for login rate limits.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    90s;
        proxy_read_timeout    90s;
    }
}
