# Development override: build the images from this source tree instead of pulling them from Docker Hub.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# The built images get the same names as the published ones (DOCKERHUB_USERNAME/sm-watch:<service>-<version>), so a later
# `docker compose pull` replaces them with the published versions. To make plain `docker compose` always
# build, put   COMPOSE_FILE=docker-compose.yml:docker-compose.build.yml   in .env.
services:
  migrate:
    build: { context: ., dockerfile: backend/Dockerfile }
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
  host-agent:
    build: { context: ., dockerfile: backend/Dockerfile.host-agent }
  frontend:
    build: { context: frontend-next, dockerfile: Dockerfile }
