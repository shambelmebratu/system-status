  #     # Known-vulnerable dependencies fail the build, so images with a published CVE are never pushed.
  #     - name: Dependency audit (Python)
  #       working-directory: backend
  #       run: |
  #         pip install pip-audit
  #         pip-audit -r requirements.txt --strict
  #     - name: Dependency audit (dashboard)
  #       working-directory: frontend-next
  #       run: npm audit --omit=dev --audit-level=high

  images:
    name: Image ${{ matrix.image }}
    #needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: sm-watch-api            # API, worker and migrations (one image, three compose services)
            context: .
            file: backend/Dockerfile
          - image: sm-watch-frontend
            context: frontend-next
            file: frontend-next/Dockerfile
          - image: sm-watch-agent          # standalone agent (Docker variant)
            context: .
            file: agent/Dockerfile
          - image: sm-watch-host-agent     # agent for the machine running SM-Watch (includes journalctl)
            context: .
            file: backend/Dockerfile.host-agent
          - image: sm-watch-k8s-agent      # in-cluster agent for Kubernetes monitoring (read-only)
            context: .
            file: backend/Dockerfile.k8s-agent
    env:
      # Pull requests and manual dry runs build the images but never push.
      PUSH: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Docker Hub secrets
        if: env.PUSH == 'true'
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Add the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
