name: Build and push Docker images

# Tests every change; on main and on version tags it also builds the four images
# (multi-arch: amd64 + arm64) and pushes them to Docker Hub.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME   your Docker Hub username (or organisation namespace owner)
#   DOCKERHUB_TOKEN      a Docker Hub access token with "Read & Write" permission
#
# Images:  <user>/sm-watch-api  <user>/sm-watch-frontend  <user>/sm-watch-agent  <user>/sm-watch-host-agent  <user>/sm-watch-k8s-agent
# Tags:    latest + sha-<short> on main;  1.2.3, 1.2 and sha-<short> on a v1.2.3 tag.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      push:
        description: "Push the images to Docker Hub"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # test:
